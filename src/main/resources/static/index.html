<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyTrack Baggage Control</title>
  <meta name="description" content="Airport baggage management dashboard: track bags, flights, passengers and claims.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffb020'/%3E%3Cpath d='M10 12h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zm3-3h6v3h-6z' fill='%231a1200'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard" aria-label="SkyTrack home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text"><b>SkyTrack</b><small>Baggage Control</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot">
        <button class="ghost-btn" id="themeBtn" type="button" aria-label="Toggle light / dark theme"></button>
        <div class="db-state" id="dbState"><i></i><span>Connecting&hellip;</span></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="page-head">
          <p class="eyebrow" id="eyebrow">Terminal</p>
          <h1 id="pageTitle">Overview</h1>
        </div>
        <div class="clock" aria-hidden="true"><span id="clockTime">--:--</span><small id="clockDate"></small></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>

  <dialog id="formDialog" class="dialog">
    <form method="dialog" id="entityForm" novalidate>
      <header class="dialog-head"><h2 id="formTitle"></h2><button class="icon-btn" type="button" data-close aria-label="Close">&times;</button></header>
      <div class="dialog-body" id="formBody"></div>
      <p class="form-error" id="formError" role="alert"></p>
      <footer class="dialog-foot">
        <button class="btn" type="button" data-close>Cancel</button>
        <button class="btn primary" id="formSave" type="submit">Save</button>
      </footer>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="dialog small">
    <form method="dialog">
      <header class="dialog-head"><h2 id="confirmTitle">Are you sure?</h2></header>
      <div class="dialog-body"><p id="confirmText"></p></div>
      <footer class="dialog-foot">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn danger" id="confirmOk" value="ok">Delete</button>
      </footer>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
